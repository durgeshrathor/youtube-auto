name: Daily Short

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install -r requirements.txt

      - name: Make and upload video
        env:
          NICHE: "amazing and surprising facts about science, space, history and nature"
          CONTENT_LANG: "Hindi"
          VOICE: "hi-IN-MadhurNeural"
          PRIVACY: "public"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: work/final.mp4
          if-no-files-found: ignore

      - name: Save topic history
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git add topics.json
          git commit -m "update topics" || echo "nothing to commit"
          git push || true
